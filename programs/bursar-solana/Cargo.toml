[package]
name = "bursar-solana"
version = "0.1.0"
description = "Bursar on Solana: spending rules for teams and their AI agents"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bursar_solana"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022", "associated_token"] }
